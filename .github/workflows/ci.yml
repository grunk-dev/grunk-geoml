# 3-platform CI matrix, same shape as grunk-occt's own ci.yml. AD-enabled builds
# (build-and-test-ad below) are Linux-only, matching pixi.toml's own `ad` feature -
# building ADOL-C/adOCCT/geoml's AD variant from source on macOS/Windows was never
# attempted.
#
# `run_examples` needs grunk-occt's own libocct_plugin.so (examples/run_example.py's
# own top comment - every recipe here genuinely mixes occt.*/geoml.* calls), which
# this repo never builds itself. Each job below `git clone`s grunk-occt's own
# `main` at its current HEAD into `../grunk-occt` (a real sibling checkout, same
# layout `pixi run run_examples` already expects locally per examples/README.md -
# NOT via actions/checkout's own `path:`, which refuses any destination outside
# $GITHUB_WORKSPACE, confirmed directly in CI) and builds it there, cached by that
# commit SHA so an unchanged grunk-occt doesn't rebuild on every grunk-geoml CI
# run - which still misses on every grunk-occt commit, same as before. In the AD
# job, that miss used to mean rebuilding ADOL-C+adOCCT from source a second time
# (~30 min) just for the sibling checkout; build-and-test-ad now symlinks that
# job's own already-built .deps/adolc and .deps/adocct into the sibling checkout
# instead (both install scripts are copied verbatim and idempotent, so they just
# skip), leaving only grunk-occt's own (cheap) AD build as a real cache miss.
# **Deferred, not done here**: distributing grunk-occt's own prebuilt plugin
# binaries (e.g. as GitHub Releases artifacts, one per platform/variant) for this
# workflow to download instead of building from source at all is still the right
# long-term fix, once grunk-occt actually publishes them.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Visual Studio shell
        if: startsWith(matrix.os, 'windows')
        uses: egor-tensin/vs-shell@v2
        with:
          arch: x64

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          cache: true

      - name: Cache grunk
        uses: actions/cache@v6
        with:
          path: .deps/grunk
          key: ${{ runner.os }}-grunk-${{ hashFiles('scripts/install_grunk.cmake') }}

      - name: Cache geoml
        uses: actions/cache@v6
        with:
          path: .deps/geoml
          key: ${{ runner.os }}-geoml-${{ hashFiles('scripts/install_geoml.cmake') }}

      - name: Install grunk
        run: pixi run -e default install_grunk

      - name: Install geoml
        run: pixi run -e default install_geoml

      - name: Configure
        run: pixi run -e default configure Release

      - name: Build
        run: pixi run -e default build

      - name: Test
        run: pixi run -e default test

      # grunk-occt is now public (was private - the original "repository ...
      # not found" failure here is gone), so a plain unauthenticated `git
      # ls-remote`/`git clone` works - no token needed. `git ls-remote`'s own
      # failure inside a `$(...)` substitution wouldn't fail the enclosing
      # `echo` (confirmed directly: silently wrote an empty sha instead of
      # erroring), so this still fails loudly on an empty sha rather than going
      # back to that one-liner.
      - name: Get grunk-occt HEAD SHA
        id: occt-sha
        shell: bash
        run: |
          set -euo pipefail
          sha=$(git ls-remote https://github.com/grunk-dev/grunk-occt.git main | cut -f1)
          if [ -z "$sha" ]; then
            echo "Could not resolve grunk-occt's main HEAD SHA" >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # actions/checkout refuses any `path` outside $GITHUB_WORKSPACE (confirmed
      # directly: "Repository path '.../grunk-occt' is not under
      # '.../grunk-geoml'") - a true sibling checkout (what run_examples' own
      # `../grunk-occt` relative path needs, see pixi.toml's run_examples task) is
      # outside that workspace by construction, so a plain `git clone` is used
      # here instead.
      - name: Checkout grunk-occt (sibling, for run_examples)
        shell: bash
        run: |
          git clone https://github.com/grunk-dev/grunk-occt.git ../grunk-occt
          git -C ../grunk-occt checkout ${{ steps.occt-sha.outputs.sha }}

      # Only build is cached here, keyed by grunk-occt's own HEAD SHA (misses on
      # every grunk-occt commit, same as before) - .deps is deliberately NOT part
      # of this cache. grunk itself is reused directly from this job's own
      # already-built .deps/grunk (see the symlink step below), cheaper than
      # cloning+building it a second time for the sibling checkout.
      - name: Cache grunk-occt sibling build
        uses: actions/cache@v6
        with:
          path: ../grunk-occt/build
          key: ${{ runner.os }}-grunk-occt-sibling-${{ steps.occt-sha.outputs.sha }}

      # install_grunk.cmake is copied verbatim between this repo and grunk-occt,
      # pinned to the same GRUNK_REV, and idempotent (skips if its install
      # prefix already has grunkConfig.cmake) - so pointing grunk-occt's own
      # .deps/grunk at the copy this job already built above makes its own
      # install_grunk step below a no-op skip instead of a second clone+build.
      - name: Reuse grunk for the grunk-occt sibling build
        shell: bash
        run: |
          mkdir -p ../grunk-occt/.deps
          ln -s "$PWD/.deps/grunk" ../grunk-occt/.deps/grunk

      - name: Build grunk-occt (sibling, for run_examples)
        working-directory: ../grunk-occt
        # grunk-occt's own `build` task has no depends-on chain of its own (see its
        # pixi.toml) - mirroring its own ci.yml's explicit install/configure/build
        # sequence here, not assuming one `pixi run build` bootstraps everything.
        run: |
          pixi run -e default install_grunk
          pixi run -e default configure Release
          pixi run -e default build

      - name: Run examples
        run: pixi run -e default run_examples

      - name: Install
        run: pixi run -e default install

  build-and-test-ad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install autotools and X11/fontconfig dev headers
        # libx11-dev et al.: adOCCT is a full from-source OCCT build, and
        # OCCT's own CMakeLists.txt pulls TKService (X11/Xlib.h) in
        # transitively via DataExchange's own STEP toolkits regardless of
        # whether Visualization is enabled - see grunk-occt's own
        # scripts/install_adocct.sh comment for how this was confirmed (same
        # script, copied verbatim into this repo too). That same script prunes
        # the rest of OCCT's module set this plugin doesn't need - this apt
        # step and that pruning are both a stopgap for building adOCCT from
        # source in CI at all, see grunk-occt/DESIGN.md's "AD validation
        # milestone" section for when/how to remove both once prebuilt
        # binaries exist.
        #
        # libfontconfig1-dev: unlike freetype (proper find_package(Freetype),
        # honors CMAKE_PREFIX_PATH), adOCCT's own occt_csf.cmake sets
        # CSF_fontconfig to the bare literal "fontconfig" - a plain linker
        # name with no 3RDPARTY_*_DIR/CMAKE_PREFIX_PATH detection, resolved
        # only via the compiler/linker's default *system* search paths, same
        # as X11 above. A conda `fontconfig` package (tried first, in
        # pixi.toml's `ad` feature) never had a way to be found by this build -
        # confirmed directly: the CI failure persisted unchanged after that
        # pixi dependency was added. apt is the fix, not pixi, for this one.
        run: sudo apt-get update && sudo apt-get install -y autoconf automake libtool libx11-dev libxmu-dev libxi-dev libxt-dev libfontconfig1-dev

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          cache: true

      - name: Cache ADOL-C/adOCCT/grunk/AD-geoml
        uses: actions/cache@v6
        with:
          path: |
            .deps/adolc
            .deps/adocct
            .deps/grunk-ad
            .deps/adgeoml
          key: ${{ runner.os }}-adolc-adocct-grunk-ad-adgeoml-${{ hashFiles('scripts/install_adolc.sh', 'scripts/install_adocct.sh', 'scripts/install_adgeoml.sh', 'scripts/install_grunk.cmake') }}

      - name: Install grunk
        run: pixi run -e ad install_grunk

      - name: Install ADOL-C
        run: pixi run -e ad install_adolc

      - name: Install adOCCT
        run: pixi run -e ad install_adocct

      - name: Install AD-enabled geoml
        run: pixi run -e ad install_adgeoml

      - name: Configure
        run: pixi run -e ad configure Release

      - name: Build
        run: pixi run -e ad build

      - name: Test
        run: pixi run -e ad test

      # See the stock job's own identical step for why the empty-sha check is
      # needed here (grunk-occt is public now, so no auth is needed either way).
      - name: Get grunk-occt HEAD SHA
        id: occt-sha
        run: |
          set -euo pipefail
          sha=$(git ls-remote https://github.com/grunk-dev/grunk-occt.git main | cut -f1)
          if [ -z "$sha" ]; then
            echo "Could not resolve grunk-occt's main HEAD SHA" >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # See the stock job's own identical step for why this is a plain `git
      # clone` and not actions/checkout: that action refuses any `path` outside
      # $GITHUB_WORKSPACE, which a true sibling checkout is by construction.
      - name: Checkout grunk-occt (sibling, for run_examples)
        run: |
          git clone https://github.com/grunk-dev/grunk-occt.git ../grunk-occt
          git -C ../grunk-occt checkout ${{ steps.occt-sha.outputs.sha }}

      # Only build-ad is cached here, keyed by grunk-occt's own HEAD SHA (so it
      # misses on every grunk-occt commit, same as before) - .deps is deliberately
      # NOT part of this cache. grunk/ADOL-C/adOCCT are reused directly from this
      # job's own already-built .deps (see the symlink step below), which is both
      # cheaper and unaffected by grunk-occt's SHA changing.
      - name: Cache grunk-occt sibling AD build
        uses: actions/cache@v6
        with:
          path: ../grunk-occt/build-ad
          key: ${{ runner.os }}-grunk-occt-sibling-ad-${{ steps.occt-sha.outputs.sha }}

      # install_grunk.cmake/install_adolc.sh/install_adocct.sh are all copied
      # verbatim between this repo and grunk-occt (grunk pinned to the same
      # GRUNK_REV, both installed as .deps/grunk-ad on either side), and all
      # three are idempotent (skip the build if their install prefix already
      # has the relevant marker file) - so pointing grunk-occt's own .deps/
      # grunk-ad, .deps/adolc, and .deps/adocct at the copies this job already
      # built a few steps above (for grunk-geoml's own AD build) makes
      # grunk-occt's own install_grunk/install_adolc/install_adocct steps below
      # into no-op skips, instead of rebuilding all three from source a second
      # time (the real bottleneck here, not the actions/cache miss on
      # grunk-occt's HEAD SHA - that miss is unavoidable on every grunk-occt
      # commit and is otherwise harmless once this reuse is in place).
      # Symlinked, not copied, since both checkouts are on the same runner
      # filesystem. Reusing .deps/adocct specifically isn't just an optimization
      # here - see README.md's "Algorithmic differentiation (AD)" section: two
      # independently-built adOCCT installs would be an ODR violation
      # (mismatched adtl::adouble) the moment a recipe mixes occt.*/geoml.* AD
      # values, as run_examples' own recipes do.
      - name: Reuse grunk/ADOL-C/adOCCT for the grunk-occt sibling build
        run: |
          mkdir -p ../grunk-occt/.deps
          ln -s "$PWD/.deps/grunk-ad" ../grunk-occt/.deps/grunk-ad
          ln -s "$PWD/.deps/adolc" ../grunk-occt/.deps/adolc
          ln -s "$PWD/.deps/adocct" ../grunk-occt/.deps/adocct

      - name: Build grunk-occt (sibling, AD variant, for run_examples)
        working-directory: ../grunk-occt
        # Same reasoning as the stock job's own sibling-build step: grunk-occt's
        # own `-e ad build` task has no depends-on chain, mirroring its own
        # ci.yml's explicit install/configure/build sequence instead.
        run: |
          pixi run -e ad install_grunk
          pixi run -e ad install_adolc
          pixi run -e ad install_adocct
          pixi run -e ad configure Release
          pixi run -e ad build

      - name: Run examples
        run: pixi run -e ad run_examples

      - name: Install
        run: pixi run -e ad install
