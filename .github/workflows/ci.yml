# 3-platform CI matrix, same shape as grunk-occt's own ci.yml. AD-enabled builds
# (build-and-test-ad below) are Linux-only, matching pixi.toml's own `ad` feature -
# building ADOL-C/adOCCT/geoml's AD variant from source on macOS/Windows was never
# attempted.
#
# `run_examples` needs grunk-occt's own libocct_plugin.so (examples/run_example.py's
# own top comment - every recipe here genuinely mixes occt.*/geoml.* calls), which
# this repo never builds itself. Each job below `git clone`s grunk-occt's own
# `main` at its current HEAD into `../grunk-occt` (a real sibling checkout, same
# layout `pixi run run_examples` already expects locally per examples/README.md -
# NOT via actions/checkout's own `path:`, which refuses any destination outside
# $GITHUB_WORKSPACE, confirmed directly in CI) and builds it there, cached by that
# commit SHA so an unchanged grunk-occt doesn't rebuild on every grunk-geoml CI
# run. **Deferred, not done here**: building a full
# sibling checkout (the AD job's own chain in particular: ADOL-C + adOCCT +
# grunk-occt's own AD build) on every cache miss is real, avoidable CI cost -
# distributing grunk-occt's own prebuilt plugin binaries (e.g. as GitHub Releases
# artifacts, one per platform/variant) for this workflow to download instead of
# building from source is the right long-term fix, once grunk-occt actually
# publishes them.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Visual Studio shell
        if: startsWith(matrix.os, 'windows')
        uses: egor-tensin/vs-shell@v2
        with:
          arch: x64

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          cache: true

      - name: Cache grunk
        uses: actions/cache@v6
        with:
          path: .deps/grunk
          key: ${{ runner.os }}-grunk-${{ hashFiles('scripts/install_grunk.cmake') }}

      - name: Cache geoml
        uses: actions/cache@v6
        with:
          path: .deps/geoml
          key: ${{ runner.os }}-geoml-${{ hashFiles('scripts/install_geoml.cmake') }}

      - name: Install grunk
        run: pixi run -e default install_grunk

      - name: Install geoml
        run: pixi run -e default install_geoml

      - name: Configure
        run: pixi run -e default configure Release

      - name: Build
        run: pixi run -e default build

      - name: Test
        run: pixi run -e default test

      - name: Get grunk-occt HEAD SHA
        id: occt-sha
        shell: bash
        run: echo "sha=$(git ls-remote https://github.com/grunk-dev/grunk-occt main | cut -f1)" >> "$GITHUB_OUTPUT"

      # actions/checkout refuses any `path` outside $GITHUB_WORKSPACE (confirmed
      # directly: "Repository path '.../grunk-occt' is not under
      # '.../grunk-geoml'") - a true sibling checkout (what run_examples' own
      # `../grunk-occt` relative path needs, see pixi.toml's run_examples task) is
      # outside that workspace by construction, so a plain `git clone` is used
      # here instead.
      - name: Checkout grunk-occt (sibling, for run_examples)
        shell: bash
        run: |
          git clone https://github.com/grunk-dev/grunk-occt.git ../grunk-occt
          git -C ../grunk-occt checkout ${{ steps.occt-sha.outputs.sha }}

      - name: Cache grunk-occt sibling build
        uses: actions/cache@v6
        with:
          path: |
            ../grunk-occt/.deps
            ../grunk-occt/build
          key: ${{ runner.os }}-grunk-occt-sibling-${{ steps.occt-sha.outputs.sha }}

      - name: Build grunk-occt (sibling, for run_examples)
        working-directory: ../grunk-occt
        # grunk-occt's own `build` task has no depends-on chain of its own (see its
        # pixi.toml) - mirroring its own ci.yml's explicit install/configure/build
        # sequence here, not assuming one `pixi run build` bootstraps everything.
        run: |
          pixi run -e default install_grunk
          pixi run -e default configure Release
          pixi run -e default build

      - name: Run examples
        run: pixi run -e default run_examples

      - name: Install
        run: pixi run -e default install

  build-and-test-ad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install autotools
        run: sudo apt-get update && sudo apt-get install -y autoconf automake libtool

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          cache: true

      - name: Cache ADOL-C/adOCCT/grunk/AD-geoml
        uses: actions/cache@v6
        with:
          path: |
            .deps/adolc
            .deps/adocct
            .deps/grunk-ad
            .deps/adgeoml
          key: ${{ runner.os }}-adolc-adocct-grunk-ad-adgeoml-${{ hashFiles('scripts/install_adolc.sh', 'scripts/install_adocct.sh', 'scripts/install_adgeoml.sh', 'scripts/install_grunk.cmake') }}

      - name: Install grunk
        run: pixi run -e ad install_grunk

      - name: Install ADOL-C
        run: pixi run -e ad install_adolc

      - name: Install adOCCT
        run: pixi run -e ad install_adocct

      - name: Install AD-enabled geoml
        run: pixi run -e ad install_adgeoml

      - name: Configure
        run: pixi run -e ad configure Release

      - name: Build
        run: pixi run -e ad build

      - name: Test
        run: pixi run -e ad test

      - name: Get grunk-occt HEAD SHA
        id: occt-sha
        run: echo "sha=$(git ls-remote https://github.com/grunk-dev/grunk-occt main | cut -f1)" >> "$GITHUB_OUTPUT"

      # See the stock job's own identical step for why this is a plain `git
      # clone` and not actions/checkout: that action refuses any `path` outside
      # $GITHUB_WORKSPACE, which a true sibling checkout is by construction.
      - name: Checkout grunk-occt (sibling, for run_examples)
        run: |
          git clone https://github.com/grunk-dev/grunk-occt.git ../grunk-occt
          git -C ../grunk-occt checkout ${{ steps.occt-sha.outputs.sha }}

      - name: Cache grunk-occt sibling AD build
        uses: actions/cache@v6
        with:
          path: |
            ../grunk-occt/.deps
            ../grunk-occt/build-ad
          key: ${{ runner.os }}-grunk-occt-sibling-ad-${{ steps.occt-sha.outputs.sha }}

      - name: Build grunk-occt (sibling, AD variant, for run_examples)
        working-directory: ../grunk-occt
        # Same reasoning as the stock job's own sibling-build step: grunk-occt's
        # own `-e ad build` task has no depends-on chain, mirroring its own
        # ci.yml's explicit install/configure/build sequence instead.
        run: |
          pixi run -e ad install_grunk
          pixi run -e ad install_adolc
          pixi run -e ad install_adocct
          pixi run -e ad configure Release
          pixi run -e ad build

      - name: Run examples
        run: pixi run -e ad run_examples

      - name: Install
        run: pixi run -e ad install
