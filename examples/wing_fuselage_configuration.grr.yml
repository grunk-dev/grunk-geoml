      -- Inner/outer stations are translated (mid stations are used as-is) - same
      -- geoml.translate(points_vec, dir, factor) pattern as the fuselage's own rear
      -- part, not geoml::move (removed from current geoml, see DESIGN.md).
      move_vec_i_wing = occt.gp_Vec.new(0.0, 1.0, 0.0)
      move_vec_o_wing = occt.gp_Vec.new(1.0, 0.0, 0.0)

      i_u_profile_curve_points = geoml.translate(i_u_profile_curve_points_initial, move_vec_i_wing, 1500.0)
      o_u_profile_curve_points = geoml.translate(o_u_profile_curve_points_initial, move_vec_o_wing, 3000.0)
      i_l_profile_curve_points = geoml.translate(i_l_profile_curve_points_initial, move_vec_i_wing, 1500.0)
      o_l_profile_curve_points = geoml.translate(o_l_profile_curve_points_initial, move_vec_o_wing, 3000.0)

      i_u_profile_curve = geoml.interpolate_points_to_b_spline_curve(i_u_profile_curve_points)
      m_u_profile_curve = geoml.interpolate_points_to_b_spline_curve(m_u_profile_curve_points)
      o_u_profile_curve = geoml.interpolate_points_to_b_spline_curve(o_u_profile_curve_points)
      i_l_profile_curve = geoml.interpolate_points_to_b_spline_curve(i_l_profile_curve_points)
      m_l_profile_curve = geoml.interpolate_points_to_b_spline_curve(m_l_profile_curve_points)
      o_l_profile_curve = geoml.interpolate_points_to_b_spline_curve(o_l_profile_curve_points)

      -- Leading/trailing guide curves: the inner/outer stations' own first/last
      -- point (translated, matching i_u_profile_curve_points->Value(1)/Value(20) in
      -- the original) plus the mid station's own (untranslated) endpoint.
      i_u_first = geoml.translate(i_u_pc_1, move_vec_i_wing, 1500.0)
      i_u_last = geoml.translate(i_u_pc_22, move_vec_i_wing, 1500.0)
      o_u_first = geoml.translate(o_u_pc_1, move_vec_o_wing, 3000.0)
      o_u_last = geoml.translate(o_u_pc_22, move_vec_o_wing, 3000.0)

      leading_curve_points = occt.gp_Pnt.as_vec(i_u_first, m_u_pc_1, o_u_first)
      trailing_curve_points = occt.gp_Pnt.as_vec(i_u_last, m_u_pc_22, o_u_last)

      leading_curve = geoml.interpolate_points_to_b_spline_curve(leading_curve_points)
      trailing_curve = geoml.interpolate_points_to_b_spline_curve(trailing_curve_points)

      -- Upper/lower wing surfaces: a 3-profile curve network, both sharing the SAME
      -- leading/trailing guide curves (the lower surface reusing the upper's own
      -- guides is exactly what the original itself does, not a copy-paste slip -
      -- see fuselage_wing_configuration.cpp:964's own list_of_guides_upper_wing).
      --
      -- TEMP DEBUG (remove once the macOS-only as_vec failure is root-caused): same
      -- substitution as wing_loft.grr.yml's own - occt.Geom_Curve.as_vec(...) hits
      -- the same macOS-only "Cannot create std::vector" failure here too (this
      -- recipe's own CI log, 2026-11-13), confirming it's grunk's own
      -- with_std_vector mechanism for Handle(Geom_Curve) that's broken on macOS/
      -- AppleClang in general, not anything specific to wing_loft's curves.
      -- geoml.debug_as_vec3 (src/transform_extras.hpp) is variadic - it drops in
      -- here unchanged despite the "3" in its name, for both the 2-arg and 3-arg
      -- calls below.
      upper_profiles = geoml.debug_as_vec3(i_u_profile_curve, m_u_profile_curve, o_u_profile_curve)
      wing_guides = geoml.debug_as_vec3(leading_curve, trailing_curve)
      lower_profiles = geoml.debug_as_vec3(i_l_profile_curve, m_l_profile_curve, o_l_profile_curve)

      upper_wing_surface = helpers.exchange_uv(geoml.interpolate_curve_network(upper_profiles, wing_guides, 1.0))
      lower_wing_surface = geoml.interpolate_curve_network(lower_profiles, wing_guides, 1.0)

      inner_cap_edges = geoml.debug_as_vec3(i_u_profile_curve, i_l_profile_curve)
      outer_cap_edges = geoml.debug_as_vec3(o_u_profile_curve, o_l_profile_curve)
      inner_wing_cap_surface = geoml.interpolate_curves(inner_cap_edges)
      outer_wing_cap_surface = helpers.exchange_uv(geoml.interpolate_curves(outer_cap_edges))

      tol = 1e1
      face_upper = occt.BRepBuilderAPI_MakeFace.new(upper_wing_surface, tol):Face()
      face_lower = occt.BRepBuilderAPI_MakeFace.new(lower_wing_surface, tol):Face()
      face_inner_cap = occt.BRepBuilderAPI_MakeFace.new(inner_wing_cap_surface, tol):Face()
      face_outer_cap = occt.BRepBuilderAPI_MakeFace.new(outer_wing_cap_surface, tol):Face()

      shell_wing = helpers.make_shell4(face_upper, face_lower, face_inner_cap, face_outer_cap)
      solid_wing = helpers.make_solid(shell_wing)
steps: |
  fuselage_solid = recipes.fuselage():get("solid_fuselage")
  wing_solid = recipes.main_wing():get("solid_wing")
  fused = occt.BRepAlgoAPI_Fuse.new(wing_solid, fuselage_solid):Shape()
  ok = occt.export_brep(fused, "wing_fuselage_configuration.brep")
outputs:
  fused: fused
  ok: ok
