# Ported from legacy-geo/tests/test_data/wing.grr (the pre-rewrite geo/grocc
# plugins' own recipe): an airfoil point list -> geo::interpolate_points (base
# curve) -> geo::transform x3 (three span-wise placements) -> geo::interpolate_curves
# (lofts the three curves into one surface) -> grocc::BRepBuilderAPI_MakeFace ->
# grocc::BRepTools::Write. This recipe now completes every one of those steps -
# see DESIGN.md's "interpolate_curves segfault, real root cause found" and its
# "The real root cause, fixed upstream" follow-up for the full story of the two
# real sol2/codegen binding bugs (not geoml bugs) that blocked this until
# 2026-09-29, when they were fixed for real in `grunk`'s own shared codegen
# (new SOL_BASE_CLASSES/SOL_DERIVED_CLASSES generation) plus this plugin's own
# codegen/hooks.py (Handle(X) parameters now emitted by value) and
# src/geoml_sol_traits.hpp (the OCCT Geom_Curve/Geom_Surface hierarchy this
# plugin references but never itself defines). The face-building step below now
# uses the *native* occt.BRepBuilderAPI_MakeFace binding directly - the
# geoml.bspline_surface_to_face(...) escape hatch this recipe used before is
# gone, no longer needed.
uses:
  grunk: 0.5.0
  occt: 0.1.0
  geoml: 0.1.0
parameters:
  # A small 4-point "airfoil-ish" section curve, chord along x, camber in y -
  # loosely modeled on legacy-geo's own wing.grr point list, not a real airfoil.
  chord: 3.0
  camber: 0.4
  span: 6.0
  sweep: 1.5
  face_tolerance: 1.0e-6
steps: |
  p1 = occt.gp_Pnt.new(0.0, 0.0, 0.0)
  p2 = occt.gp_Pnt.new(chord * 0.3, camber, 0.0)
  p3 = occt.gp_Pnt.new(chord * 0.7, -camber * 0.5, 0.0)
  p4 = occt.gp_Pnt.new(chord, 0.0, 0.0)

  -- geoml.Transform's own operator() (src/transform_extras.hpp) only has
  -- overloads for TopoDS_Shape/gp_Pnt/Handle(Geom_Surface)/gp_Vec, not a
  -- Geom_Curve handle directly - so each station's own 4 control points are
  -- transformed individually (the gp_Pnt overload), then rebuilt into a real
  -- std::vector<gp_Pnt> via occt.gp_Pnt.as_vec(...) (the only way to get one at
  -- all - a plain Lua table isn't accepted where a std::vector<T> parameter is
  -- taken by reference, confirmed throughout this project), before interpolating
  -- each station's own curve. Called as xf(p) (native __call), not xf:apply(p) -
  -- the grunk-core fix that makes this work inside a real recipe's steps: block
  -- (DynamicFeature now forwards sol::meta_function::call, see grunk commit
  -- c0cc16d) has landed; the "apply" workaround method is gone.
  root_xf = geoml.Transform.new(occt.gp_Vec.new(0.0, 0.0, 0.0))
  mid_xf = geoml.Transform.new(occt.gp_Vec.new(sweep * 0.5, 0.0, span * 0.5))
  tip_xf = geoml.Transform.new(occt.gp_Vec.new(sweep, 0.0, span))

  root_pts = occt.gp_Pnt.as_vec(root_xf(p1), root_xf(p2), root_xf(p3), root_xf(p4))
  mid_pts = occt.gp_Pnt.as_vec(mid_xf(p1), mid_xf(p2), mid_xf(p3), mid_xf(p4))
  tip_pts = occt.gp_Pnt.as_vec(tip_xf(p1), tip_xf(p2), tip_xf(p3), tip_xf(p4))

  root_curve = geoml.interpolate_points_to_b_spline_curve(root_pts, 3)
  mid_curve = geoml.interpolate_points_to_b_spline_curve(mid_pts, 3)
  tip_curve = geoml.interpolate_points_to_b_spline_curve(tip_pts, 3)

  -- Native occt.Geom_Curve.as_vec(...) (grunk-occt's own src/geom/geom_extras.hpp)
  -- builds the std::vector<Handle(Geom_Curve)> geoml.interpolate_curves needs -
  -- geoml.curve_vec/src/curve_vec_extras.hpp's own hand-rolled escape hatch is
  -- gone now that grunk's with_std_vector() supports Handle(X) element types
  -- directly (see DESIGN.md).
  cv = occt.Geom_Curve.as_vec(root_curve, mid_curve, tip_curve)
  loft_surface = geoml.interpolate_curves(cv, 3, false)

  -- Native occt.BRepBuilderAPI_MakeFace call - its own generated Handle(Geom_Surface)
  -- constructor overload now correctly accepts loft_surface's own concrete
  -- Handle(Geom_BSplineSurface) type directly (see DESIGN.md).
  face = occt.BRepBuilderAPI_MakeFace.new(loft_surface, face_tolerance):Face()

  ok = occt.export_brep(face, "wing_loft.brep")
outputs:
  face: face
  ok: ok
