# Line-by-line ported from the real original C++ source this recipe was extracted
# from (geoml repo commit 2ecbda9, "Adjust CMakeLists, finalise the modelling of the
# parametric Lastentraeger [German: "load carrier"] ..." - examples/
# fuselage_wing_configuration.cpp's own "Box with Holes" section), not reconstructed
# from scratch to merely look similar - see DESIGN.md's "load_carrier/wing_loft:
# real line-by-line re-port" for the full story of how the FIRST port of this recipe
# got this wrong (fabricated a wall_thickness parameter that never existed in the
# original at all) and how this version was verified instead (a standalone C++
# diagnostic reconstructing the original algorithm exactly and inspecting real
# edge/face indices against this project's own OCCT 7.9 build).
#
# uses: grunk: 0.2.2, grocc: 0.1.1, geo: 0.2.0 in the .grr predecessor - the modern
# occt/geoml namespaces below are 1:1 stand-ins throughout.
uses:
  grunk: 0.5.0
  occt: 0.1.0
  geoml: 0.1.0
parameters:
  rect_width: 2.0
  rect_hight: 3.0
  box_length: 10.0
  sphere_position: 3.0
  sphere_radius: 0.2
  radius_fillet: 0.05
modules:
  helpers: |
    -- geoml::make_compound(shapes) (geoml/src/geoml/utility/modeling.cpp) -
    -- BRep_Builder::MakeCompound + one Add per shape. Needs `modules:` (not bare
    -- steps:), same reason as everywhere else in this recipe: several mutating
    -- builder:Add(...) calls on the same object are unreliable across separate
    -- steps: lines under grunk's own decorated/parametric environment - see this
    -- repo's own DESIGN.md "Real recipe-API bug" entry.
    function make_compound(s1, s2, s3, s4)
      local compound = occt.TopoDS_Compound.new()
      local builder = occt.BRep_Builder.new()
      builder:MakeCompound(compound)
      builder:Add(compound, s1)
      builder:Add(compound, s2)
      builder:Add(compound, s3)
      builder:Add(compound, s4)
      return compound
    end

    -- The original's own make_fillet(o_extruded_shape, {1,2,5,8}, radius)
    -- (geoml/src/geoml/utility/modeling.cpp's make_fillet(shape, edge_indices,
    -- radius) overload) indexes DIRECTLY into OCCT's own 1-based
    -- TopTools_IndexedMapOfShape (edgeMap(i), no +/-1 adjustment at all) - a
    -- different convention from this plugin's own geoml.nth_edge (0-based, see
    -- src/topexp_extras.hpp). {1,2,5,8} (1-based) is therefore {0,1,4,7} 0-based -
    -- the SAME 4 edges, not "different, re-derived" ones. Confirmed empirically
    -- (not just arithmetic) via a standalone diagnostic (see DESIGN.md): rebuilding
    -- o_extruded_shape exactly per the original C++ and inspecting every one of its
    -- 12 edges' own endpoint coordinates shows 0-based indices 0/1/4/7 are exactly
    -- the 4 "long" edges running the full extrusion length (dx=10, dy=dz=0) - the
    -- ones a rounded rectangular tube actually needs filleted.
    function fillet_long_edges(shape, radius)
      local fillet = occt.BRepFilletAPI_MakeFillet.new(shape)
      fillet:Add(radius, geoml.nth_edge(shape, 0))
      fillet:Add(radius, geoml.nth_edge(shape, 1))
      fillet:Add(radius, geoml.nth_edge(shape, 4))
      fillet:Add(radius, geoml.nth_edge(shape, 7))
      return fillet:Shape()
    end

    -- geoml::make_shell(shape) (geoml/src/geoml/utility/modeling.cpp): wraps EVERY
    -- one of shape's own faces into a fresh TopoDS_Shell - purely topological, no
    -- offset/thickness of any kind (this is the operation the recipe's FIRST port
    -- got wrong, inventing a BRepOffsetAPI_MakeThickSolid-based thin wall with a
    -- fabricated wall_thickness parameter that has no counterpart in the original
    -- at all - see DESIGN.md).
    function make_shell(shape)
      local shell = occt.TopoDS_Shell.new()
      local builder = occt.BRep_Builder.new()
      builder:MakeShell(shell)
      local n = geoml.count_faces(shape)
      for i = 0, n - 1 do
        builder:Add(shell, geoml.nth_face(shape, i))
      end
      return shell
    end

    -- geoml::remove_faces(shell, faces) (geoml/src/geoml/utility/modeling.cpp): a
    -- fresh Shell containing every one of shell's own faces EXCEPT the ones
    -- IsSame() as face1/face2 - again purely topological, no thickness change.
    -- face1/face2 are the original's own GetFace(cut_shape, 1)/GetFace(cut_shape, 5)
    -- (0-based, same convention as geoml.nth_face - confirmed via the same
    -- diagnostic mentioned above that these are exactly the 2 flat end-cap faces,
    -- at x=0 and x=box_length, on this OCCT 7.9 build too).
    function remove_two_faces(shell, face1, face2)
      local new_shell = occt.TopoDS_Shell.new()
      local builder = occt.BRep_Builder.new()
      builder:MakeShell(new_shell)
      local n = geoml.count_faces(shell)
      for i = 0, n - 1 do
        local f = geoml.nth_face(shell, i)
        if not f:IsSame(face1) and not f:IsSame(face2) then
          builder:Add(new_shell, f)
        end
      end
      return new_shell
    end
steps: |
  -- Rectangle corner points: o_corner1 given, o_corner2 = o_corner1 + vec_y*rect_width,
  -- o_corner3 = o_corner2 + vec_z*rect_hight, o_corner4 = o_corner1 + vec_z*rect_hight -
  -- geoml::move(point, direction, factor) = point + factor*direction (direction used
  -- as-is, not normalized - both vec_y/vec_z/extr_dir below are already unit vectors,
  -- so this makes no numeric difference here), same as the current geoml.translate.
  c1 = occt.gp_Pnt.new(0.0, 0.0, 0.0)
  vec_y = occt.gp_Vec.new(0.0, 1.0, 0.0)
  vec_z = occt.gp_Vec.new(0.0, 0.0, 1.0)
  extr_dir = occt.gp_Vec.new(1.0, 0.0, 0.0)

  c2 = geoml.translate(c1, vec_y, rect_width)
  c3 = geoml.translate(c2, vec_z, rect_hight)
  c4 = geoml.translate(c1, vec_z, rect_hight)

  -- geoml::surface_from_4_points([c1,c2,c3,c4]) (a bilinear B-spline patch) -
  -- geoml.create_face(c1,c2,c3,c4) (a BRepFill::Face ruled surface) is a faithful
  -- modern equivalent for this specific, planar/rectangular input: both build the
  -- same planar quad bounded by the same 4 corners in the same loop order.
  srf = geoml.create_face(c1, c2, c3, c4)

  -- geoml::scale_vector(extr_dir, box_length) = extr_dir.Multiplied(box_length) -
  -- gp_Vec:Multiplied(scalar) is registered natively, no manual reconstruction needed.
  extr_vec = extr_dir:Multiplied(box_length)
  extruded = occt.BRepPrimAPI_MakePrism.new(srf, extr_vec):Shape()

  -- 4 small sphere cutouts, one per corner, partway along the extrusion direction.
  center_1 = geoml.translate(c1, extr_dir, sphere_position)
  center_2 = geoml.translate(c2, extr_dir, sphere_position)
  center_3 = geoml.translate(c3, extr_dir, sphere_position)
  center_4 = geoml.translate(c4, extr_dir, sphere_position)

  sphere1 = occt.BRepPrimAPI_MakeSphere.new(center_1, sphere_radius):Shape()
  sphere2 = occt.BRepPrimAPI_MakeSphere.new(center_2, sphere_radius):Shape()
  sphere3 = occt.BRepPrimAPI_MakeSphere.new(center_3, sphere_radius):Shape()
  sphere4 = occt.BRepPrimAPI_MakeSphere.new(center_4, sphere_radius):Shape()

  sphere_compound = helpers.make_compound(sphere1, sphere2, sphere3, sphere4)

  rounded_box = helpers.fillet_long_edges(extruded, radius_fillet)

  -- geoml::cut_away(rounded_box, sphere_compound) = BRepAlgoAPI_Cut(rounded_box,
  -- sphere_compound) - geoml.boolean_subtract does exactly this (same argument
  -- order: shape minus cutting_tool), wrapped in geoml.Shape for its own API.
  rounded_box_wrapped = geoml.Shape.new(rounded_box)
  spheres_wrapped = geoml.Shape.new(sphere_compound)
  cut_shape = geoml.boolean_subtract(rounded_box_wrapped, spheres_wrapped)
  cut_topods = cut_shape:shape()

  -- The original's own GetFace(cut_shape, 1)/GetFace(cut_shape, 5) - looked up
  -- against cut_topods BEFORE building the shell (helpers.make_shell/remove_two_faces
  -- only reorganize cut_topods's own existing faces into a new Shell, never change
  -- face identity, so IsSame() against these two correctly finds them again inside
  -- shell_prelim too).
  face1 = geoml.nth_face(cut_topods, 1)
  face2 = geoml.nth_face(cut_topods, 5)
  shell_prelim = helpers.make_shell(cut_topods)
  load_carrier = helpers.remove_two_faces(shell_prelim, face1, face2)

  ok = occt.export_brep(load_carrier, "load_carrier.brep")
  n_faces = geoml.count_faces(load_carrier)
outputs:
  load_carrier: load_carrier
  ok: ok
  n_faces: n_faces
