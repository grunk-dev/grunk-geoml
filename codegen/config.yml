# Declarative generator config (see DESIGN.md and grunk-occt's own codegen/README.md
# for the shared generator's own design): one entry per geoml "module", each naming
# the headers to wrap and a blacklist of specific symbols to exclude, each with a
# reason.
#
# Points --include-dir at an INSTALLED geoml prefix (built with
# -DGEOML_INSTALL_INTERNAL_API=ON - see scripts/install_geoml.cmake), not geoml's raw
# source tree - matches how grunk-occt's own generator is pointed at an installed OCCT
# include dir, and preserves the legacy grocc/config.yml.in's geoml/internal/<name>
# path shape even though geoml's own source tree moved those directories to be
# siblings of geoml/ rather than nested under it (confirmed by reading geoml's own
# src/CMakeLists.txt: GEOML_INSTALL_INTERNAL_API's own install(DIRECTORY ...) rule
# re-nests them back under include/geoml/internal/<name> at install time).
#
# IMPORTANT, real generator limitation discovered while writing this file: every
# header below is listed as a literal filename (its full path relative to
# --include-dir), never a glob (`geoml/surfaces/*.h`-style), even where a module has
# only one or two headers. This is deliberate, not stylistic: grunk.codegen's own
# expand_headers() (generate.py) reduces a *glob* match to its bare basename
# (`p.name`) before handing it back to parse_headers(), which then reconstructs the
# path as `include_dir / header` - silently correct for grunk-occt's own OCCT headers
# (all flat, directly under --include-dir, no subdirectories) but silently WRONG for
# any nested layout like geoml's own `geoml/<module>/*.h`/`geoml/internal/<name>/*.h` -
# confirmed the hard way (TranslationUnitLoadError trying to parse
# "<include-dir>/surfaces.h", which doesn't exist; the real file is
# "<include-dir>/geoml/surfaces/surfaces.h"). A *literal* (non-glob) pattern doesn't
# go through this basename-reduction at all (`matches = [pattern]`, the full string
# preserved) - hence every header here being spelled out explicitly. This also
# surfaced a real basename collision a glob-based config would have mishandled
# silently: geoml/boolean_ops/modeling.hpp and geoml/primitives/modeling.hpp share the
# exact same filename. Worth reporting upstream to grunk itself (this affects any
# future plugin wrapping a library with nested headers, not just geoml) - not fixed
# here, out of this plugin's own scope.
#
# Revives legacy-geo's config.yml.in shape (modules -> headers -> blacklist),
# repointed at the new register_type/add_constructors/add_member_function API and
# geoml's current layout - see legacy-geo/config.yml.in for the legacy version this is
# modeled on.

code_generator: hooks.py

generated_banner: |
  // SPDX-FileCopyrightText: 2026 Jan Kleinert <jan.kleinert@dlr.de>
  //
  // SPDX-License-Identifier: MPL-2.0

  // AUTO-GENERATED by codegen/generate.py from codegen/config.yml - do not edit by
  // hand, your changes will be overwritten the next time this module is regenerated.
  // See DESIGN.md's "Generated-code policy" and grunk-occt's own codegen/README.md.

  // geoml_sol_traits.hpp's sol::is_container<geoml::Shape> specialization
  // (suppressing sol2's own structural container-detection for Shape, which
  // genuinely has real begin()/end()/const_iterator members - see DESIGN.md and
  // that header's own comment) needs to be visible in *every* translation unit
  // that could push/pull a Shape through sol2, not just modules using "handle"
  // ctor mode (includes_for_kinds/includes_for_ctor_modes' own trigger condition,
  // which Shape - a plain value type - never matches). config.yml's own schema has
  // no "always include this" key, so it's injected here, in the one place that
  // genuinely is unconditional. Harmless for a module that never touches Shape at
  // all - this header is a single template specialization, self-contained, no
  // heavier an include than any of the many OCCT headers already pulled in
  // everywhere.
  #include "../src/geoml_sol_traits.hpp"

  // A blanket `using namespace geoml;`, not per-type `using geoml::X;` lines -
  // needed because the generator's own `using` emission (ModuleResult.namespace_of,
  // rendered as `using ns::Name;`) only covers types a module discovers in its
  // *own* parsed headers, not a type merely *referenced* as a parameter/return type
  // that lives in a different module's header (e.g. `predicates`'s own functions
  // return `ShapePredicate`, declared in `naming_choosing`'s Shape.h - not one of
  // predicates.cpp's own discovered entities, so no `using` line covers it, yet the
  // generator still emits the bare, unqualified name everywhere - "ShapePredicate
  // does not name a type" otherwise). This is a real, same-plugin cross-module
  // type-reference gap (distinct from the already-documented cross-*plugin*
  // Handle(X) question) that would need fixing per-module, repeatedly, without
  // this. Every one of this plugin's own wrapped types lives in `namespace geoml`,
  // so one blanket using-directive, visible everywhere via this banner, covers all
  // of them at once; no observed collision risk against OCCT's own global-namespace
  // types (their names don't overlap with anything in `namespace geoml`).
  using namespace geoml;

# See grunk-occt/codegen/config.yml's own identical keys - same hooks.py-chosen kind/
# ctor-mode names (this plugin's own hooks.py is adapted from grunk-occt's, same
# idioms), same helper headers (copied/adapted, not shared across repos - see
# DESIGN.md's "hooks.py duplication is intentional").
includes_for_kinds:
  array1: ['"../src/collections.hpp"', '<vector>']
  array2: ['"../src/collections.hpp"', '<vector>']
  real: ['"../src/geoml_ad_support.hpp"']
includes_for_ctor_modes:
  handle: ['"../src/geoml_sol_traits.hpp"']

# mode: separate (grunk-occt's own default, see its own config.yml comment for the
# OOM/compile-time rationale) - one translation unit per module. groups: empty for
# now (unlike grunk-occt's own gc/geom/... group, discovered only once an actual
# no-match-for-operator</== compile error demanded it - see DESIGN.md's "Handle(X)
# cross-plugin question" for why this project doesn't expect to need one at all for
# *cross-plugin* Handle(X) sharing, but a *same-plugin* cross-module Handle(X) return
# could still need one, the same way grunk-occt's gc/geom pair did - add a group here
# immediately if that happens).
translation_units:
  mode: separate
  groups: []

modules:
  - name: surfaces
    # extra_includes: hooks.py's own generic TopoDS_Shape-widening now widens
    # revolving_shape's own TopoDS_Shape const& overload - see
    # internal_boolean_operations's own identical extra_includes comment for
    # why.
    extra_includes:
      - TopoDS_CompSolid.hxx
      - TopoDS_Compound.hxx
      - TopoDS_Edge.hxx
      - TopoDS_Face.hxx
      - TopoDS_Shell.hxx
      - TopoDS_Solid.hxx
      - TopoDS_Vertex.hxx
      - TopoDS_Wire.hxx
    headers:
      - geoml/surfaces/surfaces.h

  - name: curves
    headers:
      - geoml/curves/BlendCurve.h
      - geoml/curves/curves.h

  - name: utilities
    headers:
      - geoml/utilities/utilities.h

  - name: boolean_ops
    # modeling.hpp - confirmed present only after patching geoml's own
    # src/CMakeLists.txt install(DIRECTORY ...) rule, which only matched "*.h" and
    # silently dropped both this module's and primitives' own *.hpp public header
    # (a real upstream install-rule gap, same class of "header-naming-convention
    # glob mismatch" already documented in grunk-occt's own config.yml for
    # BRepBuilderAPI.hxx - not yet reported/fixed upstream, worth doing so).
    headers:
      - geoml/boolean_ops/modeling.hpp

  - name: geom_topo
    headers:
      - geoml/geom_topo_conversions/geom_topo_conversions.h

  - name: data_structures
    headers:
      - geoml/data_structures/Array2d.h
      - geoml/data_structures/conversions.h

  - name: naming_choosing
    # Shape.h declares Shape/ShapePredicate/TagTrack/FindVisitor/FindIfVisitor plus
    # two private-ish helper structs (ShapeHasher/ShapeIsSame, std::hash/std::equal_to
    # specializations for internal container use, not meant to be constructed from
    # Lua). Legacy grocc's own config.yml.in blacklisted a "Data" class here ("private
    # class") - re-verified against current geoml: no such class exists anywhere in
    # this header any more, so that blacklist entry is simply obsolete, not
    # re-added.
    #
    # ShapePredicate's own combinators (operator&&/||/! - free functions, not
    # members, in the predicates module below) and its five named predicate
    # constants (is_vertex/is_edge/is_face/is_solid/has_origin - inline global
    # `ShapePredicate const` *objects*, not functions, so entirely invisible to this
    # generator, which only discovers callables) both need hand-written escape
    # hatches - see src/predicate_extras.hpp.
    #
    # Two real generator-boundary bugs found and blacklisted here, neither
    # geoml-specific (both would affect any plugin hitting the same shape):
    #   - ShapePredicate::ShapePredicate: libclang reports a zero-arg default
    #     constructor cursor for ShapePredicate, which the generator accepts and
    #     emits as `[](){ return ShapePredicate(); }` - but ShapePredicate has no
    #     actual default constructor (its only real one takes a
    #     std::function<bool(Shape const&)>, so the implicit default is
    #     compiler-suppressed) - confirmed by compiling: real, hard error ("no
    #     matching function"). Looks like the generator's constructor discovery
    #     doesn't check whether an implicitly-declared default constructor cursor
    #     is actually deleted. Harmless to blacklist entirely: ShapePredicate is
    #     never meant to be Lua-constructed from scratch anyway - it's only ever
    #     produced via predicates.cpp's own functions (has_tag, is_type, ...) or
    #     the &/|/~ combinators (src/predicate_extras.hpp), both unaffected.
    #   - Shape::begin/Shape::end: return Shape's own nested `const_iterator`
    #     typedef, but the generator emits the lambda return type as the bare,
    #     *unqualified* spelling ("const_iterator"), which doesn't compile outside
    #     the class body ("does not name a type") - a nested-type return-spelling
    #     qualification gap, not anything this plugin's own hooks.py can patch
    #     narrowly (emit_return_type() isn't given the enclosing class name to
    #     requalify it with). Not a meaningful loss for Lua scripting either way -
    #     C++ iterator semantics have no natural Lua equivalent; Shape's own
    #     direct_subshapes() (a real std::vector<Shape> accessor, already
    #     registered) covers the same use case.
    blacklist:
      - ShapePredicate::ShapePredicate
      - Shape::begin
      - Shape::end
    # extra_includes: hooks.py's own SHAPE_TOPODS_WIDEN_CLASS widens Shape's real
    # TopoDS_Shape-taking constructor into one exact-match candidate per concrete
    # TopoDS_Shape subtype (see that constant's own comment for why) - this header
    # only needs TopoDS_Shape itself complete, not any of its subtypes.
    extra_includes:
      - TopoDS_CompSolid.hxx
      - TopoDS_Compound.hxx
      - TopoDS_Edge.hxx
      - TopoDS_Face.hxx
      - TopoDS_Shell.hxx
      - TopoDS_Solid.hxx
      - TopoDS_Vertex.hxx
      - TopoDS_Wire.hxx
    headers:
      - geoml/naming_choosing/Shape.h

  - name: predicates
    # extra_includes: hooks.py's own generic TopoDS_Shape-widening now widens
    # is_same's own TopoDS_Shape const& overload - see
    # internal_boolean_operations's own identical extra_includes comment for
    # why.
    extra_includes:
      - TopoDS_CompSolid.hxx
      - TopoDS_Compound.hxx
      - TopoDS_Edge.hxx
      - TopoDS_Face.hxx
      - TopoDS_Shell.hxx
      - TopoDS_Solid.hxx
      - TopoDS_Vertex.hxx
      - TopoDS_Wire.hxx
    headers:
      - geoml/predicates/predicate_functions.h

  - name: primitives
    # modeling.hpp - see boolean_ops's own identical comment (same install-rule gap,
    # same fix, and the same basename as boolean_ops/modeling.hpp - see this file's
    # own header comment on why every header here is a literal path, not a glob).
    headers:
      - geoml/primitives/modeling.hpp

  - name: transformations
    # Transform.h's own move constructor (`Transform(Transform&&) = default;`) was
    # legacy grocc's one hand-written escape hatch ("code generator has problem with
    # move constructor"). Re-tested against this generator: the *legacy* failure
    # mode (generator itself choking on it) doesn't recur - no move-constructor
    # special-casing exists in grunk.codegen at all. But actually compiling the
    # result surfaced a *different*, real one: sol2 itself doesn't correctly handle
    # a bound function with an rvalue-reference parameter (a hard compile error
    # inside sol2's own dispatch machinery, sol/wrapper.hpp's own
    # `fx(std::forward<Args>(args)...)` - not inside the generated lambda body,
    # which is unremarkable C++ and would compile fine on its own) - confirmed
    # empirically, not geoml/Transform-specific.
    #
    # Tried fixing this generically first, in hooks.py's own classify_param
    # (rejecting any "T&&" parameter outright) - doesn't work: Param.kind()'s own
    # `if self.base in registered_types: return "object"` fast path runs *before*
    # classify_param is ever consulted, and a constructor parameter's base is
    # exactly the class being constructed (Transform, already in registered_types
    # by the time its own constructors are processed) - so this path can never be
    # intercepted from a CodeGenerator subclass at all, for this type of gap. The
    # generator's blacklist mechanism can only exclude a symbol wholesale (there is
    # no way to blacklist one specific constructor *overload*, only the constructor
    # symbol as a whole, `Transform::Transform`) - so, same shape as legacy grocc's
    # own fix in the end (if for a different underlying reason): blacklist every
    # generated constructor for Transform and hand-write the real (non-move) ones
    # in src/transform_extras.hpp instead, mirroring predicate_extras.hpp's own
    # modify_type-based pattern. Transform's own member functions (pre_multiply,
    # the four operator() overloads) are unaffected by this blacklist entry (a
    # different Callable, discovered/emitted independently) and still auto-generate
    # normally.
    blacklist:
      - Transform::Transform
    # extra_includes: hooks.py's own generic TopoDS_Shape-widening now widens
    # translate's/repeat_shape's own TopoDS_Shape const& overloads - see
    # internal_boolean_operations's own identical extra_includes comment for
    # why.
    extra_includes:
      - TopoDS_CompSolid.hxx
      - TopoDS_Compound.hxx
      - TopoDS_Edge.hxx
      - TopoDS_Face.hxx
      - TopoDS_Shell.hxx
      - TopoDS_Solid.hxx
      - TopoDS_Vertex.hxx
      - TopoDS_Wire.hxx
    headers:
      - geoml/transformations/Transform.h
      - geoml/transformations/transformations.h

  # --- internal modules: one per top-level directory (see this file's own header
  # comment), matching legacy grocc's config.yml.in's geoml/internal/<name> path
  # shape. Split from legacy's single monolithic "internal" module to keep
  # translation_units.mode: separate's per-module compile-time/memory bound
  # meaningful (grunk-occt's own DESIGN.md: an all-in-one-TU build peaked at
  # ~12-13GB RAM) - this internal tree is geoml's single biggest chunk (~80 headers).

  - name: internal_boolean_operations
    # extra_includes: BRepSewingToBRepBuilderShapeAdapter's own ctor takes a
    # BRepBuilderAPI_Sewing& - this header only forward-declares it (same
    # completeness need as grunk-occt's own extra_includes entries throughout).
    # CFuseShapes::Intersections/TrimmedChilds return ListPNamedShape
    # (std::vector<PNamedShape>, PNamedShape = CSharedPtr<CNamedShape> =
    # std::shared_ptr<CNamedShape>) - sol2's own std::shared_ptr support needs
    # CNamedShape complete wherever a PNamedShape crosses the sol2 boundary, same
    # completeness need as Handle(X)/TopoDS_Shape's own extra_includes entries in
    # grunk-occt, not the (separately investigated, and not applicable here)
    # cross-*plugin*/cross-TU concern from DESIGN.md's Handle(X) section. Formerly
    # PNamedShape was only ever seen here as a *return* type (return-type checks
    # never see a canonical spelling at all, so its bare, opaque-looking surface
    # spelling passed the generic "object" fallback's BARE_TYPE_NAME check
    # unconditionally, while the *same* type used as a parameter got canonical-
    # resolved and incorrectly rejected - a real asymmetry, since fixed upstream in
    # grunk itself, see DESIGN.md's "grunk pin bumped, canonical-spelling fix
    # unlocks more than std::string") - CBopCommon/CCutShape/CFuseShapes/
    # CGroupShapes/CMergeShapes/CTrimShape's own PNamedShape-taking constructors
    # are now accepted too, for the same reason, needing this same extra_include.
    # BOPAlgo_PaveFiller.hxx: CBopCommon/CCutShape/CTrimShape's own second/third
    # constructor overloads take a const BOPAlgo_PaveFiller& too (also newly
    # accepted by the same fix) - this header only forward-declares it, same
    # completeness need as everything else here.
    #
    # TopoDS_*.hxx (CompSolid/Compound/Edge/Face/Shell/Solid/Vertex/Wire):
    # hooks.py's own generic TopoDS_Shape-widening (see its own
    # ALL_TOPODS_SHAPE_WIDEN_TYPES comment) now widens every TopoDS_Shape
    # const& parameter/method this module's own headers declare (e.g.
    # GEOMAlgo_Splitter::AddTool, BOPBuilderShapeToBRepBuilderShapeAdapter::
    # Generated/Modified/IsDeleted) into one exact-match candidate per
    # concrete subtype - each needs its own header complete, same
    # completeness need as every other extra_includes entry here.
    extra_includes:
      - BRepBuilderAPI_Sewing.hxx
      - BOPAlgo_PaveFiller.hxx
      - geoml/internal/topology/CNamedShape.h
      - TopoDS_CompSolid.hxx
      - TopoDS_Compound.hxx
      - TopoDS_Edge.hxx
      - TopoDS_Face.hxx
      - TopoDS_Shell.hxx
      - TopoDS_Solid.hxx
      - TopoDS_Vertex.hxx
      - TopoDS_Wire.hxx
    headers:
      - geoml/internal/boolean_operations/BOPBuilderShapeToBRepBuilderShapeAdapter.h
      - geoml/internal/boolean_operations/BRepSewingToBRepBuilderShapeAdapter.h
      - geoml/internal/boolean_operations/CBooleanOperTools.h
      - geoml/internal/boolean_operations/CBopCommon.h
      - geoml/internal/boolean_operations/CCutShape.h
      - geoml/internal/boolean_operations/CFuseShapes.h
      - geoml/internal/boolean_operations/CGroupShapes.h
      - geoml/internal/boolean_operations/CMergeShapes.h
      - geoml/internal/boolean_operations/CTrimShape.h
      - geoml/internal/boolean_operations/GEOMAlgo_Splitter.hxx

  - name: internal_common
    # TracePoint/DebugScope both blacklisted - not yet root-cause-fixed, TODO:
    # both fail to compile once actually registered ("use of deleted function"
    # TracePoint's own move constructor, and a use of deleted std::atomic<int>
    # copy constructor inside Debugging.h itself) - both classes hold a
    # non-copyable, non-movable member (an atomic counter), which the generator's
    # own owns_resource_unsafely() heuristic (checks only for an explicit
    # destructor anywhere in the base chain) doesn't detect as needing
    # "unique_ptr" ctor mode instead of "value" - a real, narrow generator
    # heuristic gap. Low-value to fix properly right now either way: both are
    # internal debug-dump tooling (dumping shapes to disk for troubleshooting),
    # not core CAD-modeling API. Same root cause as internal_geometry's own
    # InterpolatePointsWithKinks entry - see DESIGN.md's "Known generator gaps
    # blacklisted for now" for the consolidated writeup and what a real fix would
    # look like.
    blacklist:
      - TracePoint
      - DebugScope
    # extra_includes: hooks.py's own generic TopoDS_Shape-widening now widens
    # dumpShape's own TopoDS_Shape const& parameter - see
    # internal_boolean_operations's own identical extra_includes comment for why.
    extra_includes:
      - TopoDS_CompSolid.hxx
      - TopoDS_Compound.hxx
      - TopoDS_Edge.hxx
      - TopoDS_Face.hxx
      - TopoDS_Shell.hxx
      - TopoDS_Solid.hxx
      - TopoDS_Vertex.hxx
      - TopoDS_Wire.hxx
    headers:
      - geoml/internal/common/COptionList.h
      - geoml/internal/common/CommonFunctions.h
      - geoml/internal/common/Debugging.h
      - geoml/internal/common/any.h
      - geoml/internal/common/sorting.h
      - geoml/internal/common/stringtools.h
      - geoml/internal/common/to_string.h
      - geoml/internal/common/typename.h

  - name: internal_contrib
    # .hxx here, not .h - contrib/ is vendored third-party code (SurfTools/MakeLoops/
    # MakePatches), kept in its own original naming convention.
    #
    # extra_includes: hooks.py's own generic TopoDS_Shape-widening now widens
    # MakeLoops's/MakePatches's own TopoDS_Shape const& constructor/Init
    # parameters - see internal_boolean_operations's own identical
    # extra_includes comment for why.
    extra_includes:
      - TopoDS_CompSolid.hxx
      - TopoDS_Compound.hxx
      - TopoDS_Edge.hxx
      - TopoDS_Face.hxx
      - TopoDS_Shell.hxx
      - TopoDS_Solid.hxx
      - TopoDS_Vertex.hxx
      - TopoDS_Wire.hxx
    headers:
      - geoml/internal/contrib/MakeLoops.hxx
      - geoml/internal/contrib/MakePatches.hxx
      - geoml/internal/contrib/SurfTools.hxx

  - name: internal_exports
    # CADExporter blacklisted (bare - whole class): abstract (pure virtual methods),
    # but owns_resource_unsafely()'s heuristic (explicit destructor anywhere in the
    # base chain -> "unique_ptr" ctor mode) doesn't check for abstractness, so the
    # generator still emits a default `std::make_unique<CADExporter>()` constructor
    # attempt - "invalid new-expression of abstract class type", a real, narrow
    # generator gap (same general shape as the TracePoint/DebugScope one above:
    # owns_resource_unsafely() sees "needs heap allocation" correctly but doesn't
    # separately check "is this concrete C++"). Only ever meant to be used
    # polymorphically from C++ (subclassed per export format) - not a loss for Lua
    # scripting, which never constructs one directly anyway (ExporterFactory::Create
    # is the real entry point, itself already rejected - returns
    # std::unique_ptr<CADExporter>, a return shape this generator doesn't support at
    # all). extra_includes: GetShape() returns PNamedShape - see
    # internal_boolean_operations's own identical extra_includes comment for why.
    # See DESIGN.md's "Known generator gaps blacklisted for now" for the
    # consolidated writeup and what a real fix would look like.
    blacklist:
      - CADExporter
    extra_includes:
      - geoml/internal/topology/CNamedShape.h
    headers:
      - geoml/internal/exports/CADExporter.h
      - geoml/internal/exports/CCPACSImportExport.h
      - geoml/internal/exports/CGlobalExporterConfigs.h
      - geoml/internal/exports/ExportBrep.h
      - geoml/internal/exports/ExportIges.h
      - geoml/internal/exports/ExportStep.h
      - geoml/internal/exports/ExportStl.h
      - geoml/internal/exports/ExporterFactory.h

  - name: internal_geometry
    # geometry/curve-networks/*.h - legacy grocc's config.yml.in had this commented
    # out entirely ("never attempted"), not blacklisted - actually tried here rather
    # than assumed broken (see DESIGN.md).
    #
    # Three real, narrow issues found and blacklisted rather than root-caused
    # (not yet root-caused, TODO for each):
    #   - SurfaceDirection and ConcatDir (bare enums): `new_enum("SurfaceDirection",
    #     "u", u, "v", v, "both", both)` emits its enumerators as bare, unqualified
    #     C++ expressions - correct for a plain `enum`, but both of these are scoped
    #     `enum class`es, whose enumerators need e.g. `SurfaceDirection::`
    #     qualification even with `using namespace geoml;` in scope (a
    #     using-directive only affects namespace-level lookup, not enum-class member
    #     scoping) - "'u' was not declared", confirmed a real generator gap for enum
    #     classes specifically (this plugin's own other enums - IntStatus,
    #     Continuity, ShapeGroupMode, FaceNameSettings, MakeLoopsStatus,
    #     MakePatchesStatus, LogLevel, TrimOperation - are all plain `enum`s, so this
    #     hadn't come up before; ConcatDir/SurfaceDirection appear to be the only two
    #     `enum class`es anywhere in this plugin's own coverage so far).
    #   - Transformation::Decompose: the generated zero-arg
    #     `[](Transformation const& self) { self.Decompose(); }` doesn't match any
    #     real overload ("no matching function") - Decompose()'s real signature
    #     likely takes out-parameters this generator doesn't support (same
    #     established "no Lua-side identity for a bare number/bool to mutate in
    #     place" limitation documented throughout grunk-occt's own config.yml), not
    #     yet confirmed against the actual header.
    #   - BSplineAlgorithms::getKinkParameters: one accepted overload
    #     (Handle(Geom_BSplineCurve) -> std::vector<double>) is genuinely fine: the
    #     *other* (Handle(Geom_BSplineSurface) -> SurfaceKinks) fails ("'SurfaceKinks'
    #     does not name a type" - likely a nested type inside another class, not
    #     reachable via a blanket `using namespace geoml;`). Both share one
    #     blacklist symbol (a static method's overloads can't be blacklisted
    #     individually, only the whole `BSplineAlgorithms::getKinkParameters`
    #     symbol) - accepted as a real, if partial, coverage loss for this pass.
    #
    # Two more of the same "nested-type-as-return-type" gap found after grunk's own
    # pin was bumped (see DESIGN.md's "grunk pin bumped, canonical-spelling fix
    # unlocks more than std::string") - not new bugs, just newly-reachable code that
    # nobody had exercised yet, same underlying gap as SurfaceKinks above:
    #   - BSplineFit::Fit/FitOptimal: both return a bare `error`, but `error` is a
    #     plain `enum` nested *inside* `class BSplineFit` itself
    #     (geoml/internal/geometry/BSplineFit.h), not a free top-level type - the
    #     blanket `using namespace geoml;` only helps namespace-level lookup, not
    #     class-nested-type scoping (the exact same reason SurfaceKinks above
    #     fails), so the generated `-> error` return type doesn't compile ("'error'
    #     does not name a type"). Both methods share one blacklist entry each
    #     (all overloads of a given name are blacklisted together, same limitation
    #     as getKinkParameters above).
    #   - InterpolatePointsWithKinks (bare class, all constructors): holds a
    #     Cache<...> member containing a non-copyable std::mutex, so its move
    #     constructor is implicitly deleted - the generator's own
    #     owns_resource_unsafely() heuristic (checks only for an explicit destructor
    #     anywhere in the base chain to decide "needs unique_ptr ctor mode instead
    #     of value") doesn't catch a deleted move/copy constructor with no explicit
    #     destructor at all, so it still emits a by-value constructor lambda that
    #     fails to compile ("use of deleted function ...::InterpolatePointsWithKinks
    #     (InterpolatePointsWithKinks&&)") - the exact same category of gap
    #     internal_common's own TracePoint/DebugScope blacklist entries document
    #     (a non-copyable/non-movable member the heuristic has no way to see).
    #
    # See DESIGN.md's "Known generator gaps blacklisted for now" for the
    # consolidated, cross-referenced writeup of all of these (grouped by root cause,
    # with what a real grunk.codegen fix would look like for each) - the single
    # place to check before re-deriving any of this from scratch later.
    #
    # BSplineFit::Curve (returns Handle(Geom_BSplineCurve), unused by any example/
    # test): compiles fine on Linux/macOS, but fails windows-latest CI with a real
    # MSVC-only sol2 bug - pushing this return value is the ONLY place this plugin's
    # own generated code returns a bare Handle(Geom_X) whose usertype is actually
    # registered in grunk-occt's own, separately-compiled TUs, not this plugin's own
    # (everywhere else this plugin returns a Handle(Geom_X), it's immediately wrapped
    # - see curves.cpp/surfaces.cpp - never pushed to Lua raw). sol2's generic
    # "unregistered type" push path (stack_detail::set_undefined_methods_on) tries
    # to auto-generate default comparison metamethods by SFINAE-probing `T{} < T{}`/
    # `T{} == T{}` (is_automagical<T>, sol/usertype_core.hpp) - Geom_BSplineCurve
    # supports neither, and GCC/Clang's SFINAE correctly skips generating them, but
    # MSVC fails hard instead ("C3889: call to object of class type 'std::less<void>':
    # no matching call operator found", confirmed directly in CI). Tried disabling
    # automagic registrations for the type directly (sol::is_automagical<
    # Geom_BSplineCurve> = false, sol2's own documented escape hatch for exactly
    # this) - did not fix it on MSVC, root cause not fully isolated beyond the above;
    # blacklisting is the pragmatic fix for an unused method, not a deliberate
    # position that the type can never be pushed safely.
    blacklist:
      - SurfaceDirection
      - ConcatDir
      - BSplineFit::Fit
      - BSplineFit::FitOptimal
      - BSplineFit::Curve
      - InterpolatePointsWithKinks
      - Transformation::Decompose
      - BSplineAlgorithms::getKinkParameters
    # extra_includes: Transformation::operator()(PNamedShape) - PNamedShape crossing
    # the sol2 boundary needs CNamedShape complete, same completeness need as
    # internal_boolean_operations/internal_exports's own identical extra_includes
    # (this parameter was rejected outright until grunk's own Param.kind() canonical-
    # spelling over-rejection was fixed upstream - see DESIGN.md's "two bugs fixed
    # upstream" - so this module never needed it before).
    #
    # TopoDS_*.hxx: hooks.py's own generic TopoDS_Shape-widening now widens
    # Transformation::Transform's own TopoDS_Shape const& overload - see
    # internal_boolean_operations's own identical extra_includes comment for
    # why.
    extra_includes:
      - geoml/internal/topology/CNamedShape.h
      - TopoDS_CompSolid.hxx
      - TopoDS_Compound.hxx
      - TopoDS_Edge.hxx
      - TopoDS_Face.hxx
      - TopoDS_Shell.hxx
      - TopoDS_Solid.hxx
      - TopoDS_Vertex.hxx
      - TopoDS_Wire.hxx
    headers:
      - geoml/internal/geometry/ApproxResult.h
      - geoml/internal/geometry/ArcLengthReparameterization.h
      - geoml/internal/geometry/BSplineAlgorithms.h
      - geoml/internal/geometry/BSplineApproxInterp.h
      - geoml/internal/geometry/BSplineFit.h
      - geoml/internal/geometry/CFunctionToBspline.h
